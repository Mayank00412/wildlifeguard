services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./videos:/app/videos
      - ./processed:/app/processed
      - ./results:/app/results
      - ./models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # PostgreSQL is optional; local development can use SQLite via DATABASE_URL.
  # Uncomment when switching away from SQLite.
  # database:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: wildlifeguard
  #     POSTGRES_USER: wildlifeguard
  #     POSTGRES_PASSWORD: wildlifeguard
  #   ports:
  #     - "5432:5432"
